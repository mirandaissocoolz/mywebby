<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miranda su</title>
<link rel="icon" type="image/png" href="/tab%20icon/White%20Goose.png">
<link rel="preload" href="assets/miranda-head.glb" as="fetch" crossorigin>
<link rel="preload" href="assets/museum_of_ethnography_1k.hdr" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Brawler&family=Figtree:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="footer.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<script>
  // The page is laid out on the Figma frame's 1200 × 811 grid and scaled to fit the window
  // (see .stage in styles.css). Set before first paint so nothing jumps.
  (function () {
    function fit() {
      var w = innerWidth, h = innerHeight;
      var s = w >= h ? Math.min(w / 1200, h / 811) : w / 720;
      document.documentElement.style.setProperty("--s", s);
      // The footer is 1200 wide and has links at its left edge, so it always fits the width.
      document.documentElement.style.setProperty("--fs", Math.min(s, w / 1200));
    }
    fit();
    addEventListener("resize", fit);
  })();
</script>
</head>
<body>

<div class="page">
  <main class="stage">

    <nav class="dash" aria-label="Main">
      <a href="/">About</a>
      <a href="/v2/" aria-current="page">Home</a>
      <a href="#">Resume</a>
    </nav>

    <!-- Behind the head -->
    <img class="art grid-h" src="assets/figma/horizontal-lines.svg" alt="">
    <img class="art grid-v" src="assets/figma/vertical-lines.svg" alt="">
    <div class="art burst-outline"><img src="assets/figma/warning.svg" alt=""></div>
    <div class="art warning-triangle"><img src="assets/figma/warning-triangle.svg" alt=""></div>
    <img class="art warning-sign" src="assets/figma/warning-sign.svg" alt="">
    <img class="art good-design" src="assets/figma/good-design-triangle.svg" alt="">
    <img class="art glow" src="assets/figma/gradient-circles.svg" alt="">
    <img class="art star-small" src="assets/figma/star-yellow-small.svg" alt="">

    <!-- Miranda's head: a still of the 3D scene until the live head is ready -->
    <div class="head">
      <img class="head-fallback" src="assets/miranda-render.webp" alt="3D render of Miranda's head" width="975" height="853">
      <canvas class="head-canvas" aria-hidden="true"></canvas>
    </div>

    <!-- In front of the head -->
    <a class="sticker school" href="https://uwaterloo.ca/future-students/programs/global-business-and-digital-arts" target="_blank" rel="noopener" aria-label="GBDA at Waterloo, 2A">
      <span class="school-tag"><img src="assets/figma/school-tag.svg" alt=""></span>
      <span class="school-line school-line-1" aria-hidden="true">GBDA @</span>
      <span class="school-line school-line-2" aria-hidden="true">Waterloo</span>
      <img class="grade-tag" src="assets/figma/grade-tag.svg" alt="">
      <span class="grade grade-2" aria-hidden="true">2</span>
      <span class="grade grade-a" aria-hidden="true">A</span>
    </a>
    <img class="art star-large" src="assets/figma/star-yellow-large.svg" alt="">
    <a class="sticker connect" href="https://www.linkedin.com/in/miranda-suu/" target="_blank" rel="noopener">
      <span class="connect-card"></span>
      <span class="connect-text">Let’s Connect</span>
      <span class="connect-arrow"><img src="assets/figma/connect-arrow.svg" alt=""></span>
    </a>
    <img class="art star-lavender" src="assets/figma/star-lavender.svg" alt="">

    <div class="intro">
      <h1><span class="intro-hi">Hi I’m Miranda.</span> I make fun and whimsical designs that make people smile.</h1>
      <img class="intro-arrow" src="assets/figma/down-arrow.svg" alt="" width="26" height="26">
    </div>

  </main>
</div>

<footer class="footer">
  <div class="footer-stage">
    <div class="footer-card">
      <p class="footer-heading">Let’s make something cool together</p>
      <div class="footer-stamps" aria-hidden="true"></div>
      <nav class="footer-col footer-col-find" aria-labelledby="footer-find">
        <h2 id="footer-find">Find Me</h2>
        <ul>
          <li><a href="https://x.com/mirandaiscoolz" target="_blank" rel="noopener">Twitter</a></li>
          <li><a href="https://www.linkedin.com/in/miranda-suu/" target="_blank" rel="noopener">LinkedIn</a></li>
          <li><a href="https://www.instagram.com/mirandasuissocool/" target="_blank" rel="noopener">Instagram</a></li>
        </ul>
      </nav>
      <nav class="footer-col footer-col-pages" aria-labelledby="footer-pages">
        <h2 id="footer-pages">Pages</h2>
        <ul>
          <li><a href="/v2/">Home</a></li>
          <li><a href="/">About</a></li>
          <li><a href="#">Resume</a></li>
        </ul>
      </nav>
      <div class="stamp-ghost" aria-hidden="true"></div>
    </div>
  </div>
</footer>

<script type="module" src="head.js"></script>
<script type="module" src="footer.js"></script>
</body>
</html>
