<script>
  // Laid out on the Figma frame's 1440px grid and zoomed out (never in) by --s so that:
  //   - the whole unicorn fits in the first screen: its bottom is FOLD px down the page,
  //     plus a little breathing room;
  //   - the layout is at least MIN px wide (100px side margins can give back 55px each).
  // --page-w is the layout width at that zoom, and --off is how far it differs from 1440 on
  // each side. Wider layouts fill the window (100px side margins, unicorn flush right).
  (function () {
    var MIN = 1330, FOLD = 742 + 40, FLOOR = 0.6;
    function fit() {
      var de = document.documentElement, r = de.style;
      var w = de.clientWidth, h = innerHeight;
      var s = Math.max(FLOOR, Math.min(1, w / MIN, h / FOLD));
      var layout = Math.max(w / s, MIN);
      r.setProperty("--s", s);
      r.setProperty("--page-w", layout + "px");
      r.setProperty("--off", (layout - 1440) / 2 + "px");
    }
    fit();
    addEventListener("resize", fit);
  })();
</script>
